<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>登录 · OpenVPN 控制台</title>
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="loginTitle">
        <div class="login-form-side">
          <div class="login-brand">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 2.8a9.2 9.2 0 1 0 7.4 14.65M12 7a5 5 0 1 0 3.6 8.47"/><path d="M12 12 20.5 3.5M16.5 3.5h4v4"/></svg>
            </span>
            <span><strong>OpenVPN</strong><small>OAuth2 Control</small></span>
          </div>

          <div class="login-heading">
            <p>ADMIN ACCESS</p>
            <h1 id="loginTitle">登录控制台</h1>
            <span>使用管理员账号进入 VPN 运维工作台。</span>
          </div>

          <form id="loginForm">
            <label class="login-field">
              <span>管理员账号</span>
              <span class="input-shell">
                <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                <input name="username" autocomplete="username" maxlength="64" autofocus required />
              </span>
            </label>
            <label class="login-field">
              <span>密码</span>
              <span class="input-shell">
                <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                <input id="password" name="password" type="password" autocomplete="current-password" required />
                <button id="togglePassword" type="button" aria-label="显示密码">显示</button>
              </span>
            </label>
            <p class="login-error" id="loginError" role="alert" aria-live="polite"></p>
            <button class="login-submit" id="loginButton" type="submit">
              <span>进入控制台</span>
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </form>

          <p class="login-help">首次登录使用部署时设置的管理员密码，登录后可在“系统设置”中修改。</p>
        </div>

        <aside class="login-signal" aria-label="OpenVPN 服务访问说明">
          <div class="signal-top">
            <span class="signal-status"><i></i>安全管理入口</span>
            <span class="signal-code">TLS / SESSION</span>
          </div>
          <div class="signal-copy">
            <p>CONTROL PLANE</p>
            <h2>从身份到隧道，<br />保持每一步可见。</h2>
            <span>登录后可检查 OAuth2 认证、VPN 会话、访问目标与证书状态。</span>
          </div>
          <div class="signal-path" aria-hidden="true">
            <span><i></i>ADMIN</span><b></b><span><i></i>OAUTH2</span><b></b><span><i></i>VPN</span>
          </div>
          <div class="signal-foot">
            <span>会话保护</span>
            <strong>HttpOnly · SameSite</strong>
          </div>
        </aside>
      </section>
      <footer>OpenVPN OAuth2 · 管理访问仅限授权人员</footer>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
